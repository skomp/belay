bundle_format: 1
id: stockroom-basics
title: Stockroom Basics
description: >
  Count what is on the shelf, label it so the count can be repeated, and decide
  when to reorder. A small worked stockroom, kept in a spreadsheet.
subjects: [inventory, spreadsheets]
aliases: [stock-counting-basics]
level: beginner
style: [project-driven, interactive]
levels: true

covers:
  stock-counting:
    summary: >
      Count the items on a shelf in a way another person can repeat and get the
      same number.
  shelf-labelling:
    summary: >
      Label shelves and items so that a count names where it was taken.
  reorder-points:
    summary: >
      Pick the stock level at which an order is placed, and say what it
      protects against.

lessons:
  - lessons/00-setup.md
  - lessons/01-placement.md
  - lessons/02-counting/LESSON.md
  - lessons/03-shelf-stories/LESSON.md

workspace_kind: new-repository
tutor_owned:   [tutorial/STATE.md, tutorial/DESIGN.md]
learner_owned: [stockroom.csv, notes/**]
ownership_policy: tutor-must-not-edit-learner-owned

validators:
  has-sheet: { kind: file-exists, path: stockroom.csv }
  explains-count: { kind: manual }

one_task_at_a_time: true
solution_code: on-request-only
advance_on: validated-evidence-only
