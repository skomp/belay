bundle_format: 1
id: rust-cli-basics
title: Rust Fundamentals Through a Command-Line Tool
description: >
  Core Rust taught by building `tally`, a small command-line tool that counts
  the lines or the words in a text file. Arguments, one subcommand dispatch,
  errors with Result, and a unit test.
teaching_method: >
  You write every line of `tally` yourself, one task at a time, and each lesson changes
  that same program rather than starting a new one. A lesson finishes when `cargo check`
  or `cargo test` says so, and solutions are yours for the asking.
subjects: [rust, cli, command-line, error-handling, testing]
aliases: [argv, subcommand, rust-basics, first-rust-program, beginner-rust]
level: beginner
style: [project-driven, interactive, short-form]

lessons:
  - lessons/00-hello-args.md
  - lessons/01-subcommands/LESSON.md
  - lessons/02-errors-and-tests.md

optional_lessons:
  lessons/pure-core-and-edges.md:
    offer_at:      [lessons/01-subcommands/LESSON.md]
    offer_because: >
      A counting function that opens the file itself cannot be checked without a
      file on disk, and lesson 02 is where that bill arrives.
    anticipates:   [counting-coupled-to-io, test-needs-a-fixture-file]
    repair_in:     lessons/01-subcommands/LESSON.md
    required_for:  [lessons/02-errors-and-tests.md]
  lessons/what-is-a-character.md:
    offer_at:      [lessons/02-errors-and-tests.md]
    offer_because: >
      DESIGN.md leaves a chars command undecided because nobody agrees what a
      character is. There is a short lesson on that argument whenever you want it.

workspace_kind: new-repository
tutor_owned:    [tutorial/STATE.md, tutorial/DESIGN.md]
learner_owned:  [src/**, tests/**, Cargo.toml]
ownership_policy: tutor-must-not-edit-learner-owned

validators:
  cargo-check:    { kind: command, command: [cargo, check] }
  cargo-test:     { kind: command, command: [cargo, test] }
  has-test:       { kind: file-contains, path: src/main.rs, pattern: "#\\[test\\]" }
  explains-choice: { kind: manual }

failure_modes:
  counting-coupled-to-io:
    summary: >
      A counting function opens the file itself, so the counting rules cannot be
      checked without a file on disk.
    signals: [validator:cargo-test, validator:explains-choice, diagnosis]
  test-needs-a-fixture-file:
    summary: >
      A test of the counting rules fails unless a fixture file exists, so the
      suite depends on files the course never creates.
    signals: [token:FIXTURE_FILE_REQUIRED, diagnosis]

one_task_at_a_time: true
solution_code: on-request-only
advance_on: validated-evidence-only
